name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-24
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate HTML/JS syntax
        run: node --check index.html
      - name: Run Lighthouse
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: 'https://mohsen-niksirat.github.io/CodeVis/'
          budgetPath: './lighthouse-budget.json'
        continue-on-error: true