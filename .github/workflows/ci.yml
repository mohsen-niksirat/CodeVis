name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate HTML/JS syntax
        run: |
          node -e "const fs=require('fs');const h=fs.readFileSync('index.html','utf8');const i=h.indexOf('<script>');const j=h.indexOf('</script>',i);new Function(h.substring(i+8,j));console.log('JS syntax OK')"
      - name: Run Lighthouse
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: 'https://mohsen-niksirat.github.io/CodeVis/'
          budgetPath: './lighthouse-budget.json'
        continue-on-error: true