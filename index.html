<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#8b5cf6">
<title>CodeVis</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--surface:#161b22;--border:#30363d;--text:#c9d1d9;--accent:#8b5cf6;--accent2:#a78bfa;--green:#3fb950;--red:#f85149}
[data-theme="light"]{--bg:#ffffff;--surface:#f6f8fa;--border:#d0d7de;--text:#1f2328;--accent:#7c3aed;--accent2:#6d28d9;--green:#1a7f37;--red:#cf222e}
[data-theme="light"] canvas{background:#f0f0f0}
[data-theme="light"] .code-block{background:#f0f0f0;color:#1f2328}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center}
[dir="rtl"] body{font-family:'Vazirmatn','Segoe UI',system-ui,sans-serif}
header{width:100%;max-width:900px;padding:24px 20px 0;display:flex;justify-content:space-between;align-items:center}
header h1{font-size:1.5rem;color:var(--accent2);letter-spacing:-0.5px}
.header-right{display:flex;gap:10px;align-items:center}
.streak{background:var(--surface);border:1px solid var(--border);padding:6px 14px;border-radius:20px;font-size:.85rem;color:var(--green)}
.lang-btn{background:var(--surface);border:1px solid var(--border);color:var(--accent2);padding:6px 14px;border-radius:20px;font-size:.85rem;cursor:pointer;font-weight:600;transition:opacity .2s}
.lang-btn:hover{opacity:.7}
.theme-btn{background:var(--surface);border:1px solid var(--border);color:var(--accent2);padding:6px 14px;border-radius:20px;font-size:.85rem;cursor:pointer;font-weight:600;transition:opacity .2s}
.theme-btn:hover{opacity:.7}
.controls{width:100%;max-width:900px;padding:16px 20px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.controls select,.controls input,.controls button{background:var(--surface);color:var(--text);border:1px solid var(--border);padding:8px 14px;border-radius:8px;font-size:.85rem;outline:none}
.controls button{cursor:pointer;background:var(--accent);color:#fff;border:none;font-weight:600;transition:opacity .2s}
.controls button:hover{opacity:.85}
.controls button.secondary{background:var(--surface);color:var(--text);border:1px solid var(--border)}
.main{width:100%;max-width:900px;padding:0 20px 40px;display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:700px){.main{grid-template-columns:1fr}header{flex-direction:column;gap:12px;align-items:flex-start}.controls{flex-direction:column}.controls select,.controls input,.controls button{width:100%}.stats{flex-direction:column}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;overflow:hidden}
.card h2{font-size:1.1rem;margin-bottom:6px;color:var(--accent2)}
.card .level{display:inline-block;font-size:.7rem;padding:2px 8px;border-radius:10px;background:var(--border);color:var(--text);margin-bottom:12px;text-transform:uppercase}
.card .desc{font-size:.9rem;line-height:1.6;margin-bottom:16px;color:#8b949e}
canvas{width:100%;height:300px;border-radius:8px;background:#0a0e14;display:block}
.code-block{background:#0a0e14;border-radius:8px;padding:14px;font-family:'Fira Code',monospace;font-size:.8rem;line-height:1.7;overflow-x:auto;white-space:pre;color:#e6edf3;max-height:300px;overflow-y:auto;direction:ltr;text-align:left}
.step-controls{display:flex;gap:8px;margin-top:14px;align-items:center}
.step-controls button{padding:6px 16px;font-size:.8rem}
.step-indicator{font-size:.8rem;color:#8b949e;margin-left:auto}
[dir="rtl"] .step-indicator{margin-left:0;margin-right:auto}
.calendar{width:100%;max-width:900px;padding:0 20px 40px}
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-header h3{font-size:1rem;color:var(--accent2);margin:0}
.cal-nav{background:var(--surface);border:1px solid var(--border);color:var(--text);padding:4px 12px;border-radius:6px;cursor:pointer;font-size:.85rem}
.cal-nav:hover{opacity:.7}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-day{aspect-ratio:1;border-radius:4px;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:.7rem;color:#484f58}
.cal-day.done{background:var(--accent);color:#fff;border-color:var(--accent)}
.cal-day.today{border-color:var(--green);color:var(--green)}`n.stats{width:100%;max-width:900px;padding:0 20px 40px;display:flex;gap:12px;flex-wrap:wrap}`n.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px 24px;flex:1;min-width:140px;text-align:center}`n.stat-card .val{font-size:1.5rem;font-weight:700;color:var(--accent2)}`n.stat-card .lbl{font-size:.8rem;color:#8b949e;margin-top:4px}
#shareCanvas{display:none}
</style>
</head>
<body>
<header>
<h1>CodeVis</h1>
<div class="header-right">
<button class="theme-btn" id="themeBtn"></button>
<button class="lang-btn" id="langBtn">فا</button>
<div class="streak" id="streak"></div>
</div>
</header>
<div class="controls">
<select id="categoryFilter"></select>
<select id="levelFilter"></select>
<input type="text" id="search">
<button class="secondary" id="randomBtn"></button>
<button id="shareBtn"></button>
<button class="secondary" id="gifBtn">GIF</button>
</div>
<div class="main">
<div class="card">
<h2 id="conceptTitle"></h2>
<span class="level" id="conceptLevel"></span>
<p class="desc" id="conceptDesc"></p>
<canvas id="animCanvas" width="800" height="600"></canvas>
<div class="step-controls">
<button class="secondary" id="prevBtn"></button>
<button id="playBtn"></button>
<button class="secondary" id="nextBtn"></button>
<span class="step-indicator" id="stepInfo"></span>
</div>
</div>
<div class="card">
<h2 id="codeTitle"></h2>
<div class="code-block" id="codeBlock"></div>
</div>
</div>
<div class="calendar">
<div class="cal-header">
<button class="cal-nav" id="calPrev">&lt;</button>
<h3 id="progressTitle"></h3>
<button class="cal-nav" id="calNext">&gt;</button>
</div>
<div class="cal-grid" id="calGrid"></div>
</div>
<div class="stats"><div class="stat-card"><div class="val" id="statTotal">0</div><div class="lbl" id="statTotalLbl"></div></div><div class="stat-card"><div class="val" id="statBest">0</div><div class="lbl" id="statBestLbl"></div></div><div class="stat-card"><div class="val" id="statConcepts">0</div><div class="lbl" id="statConceptsLbl"></div></div></div><canvas id="shareCanvas" width="1200" height="675"></canvas>
<script>
const i18n={
en:{
streak:"day streak",allCategories:"All Categories",ds:"Data Structures",algo:"Algorithms",pattern:"Patterns",web:"Web",
allLevels:"All Levels",beginner:"Beginner",intermediate:"Intermediate",advanced:"Advanced",
searchPh:"Search concepts...",random:"Random",share:"Share as PNG",
play:"Play",pause:"Pause",prev:"Prev",next:"Next",step:"Step",code:"Code",progress:"Progress",langToggle:"فا"
},
fa:{
streak:"روز متوالی",allCategories:"همه دسته‌ها",ds:"ساختمان داده",algo:"الگوریتم‌ها",pattern:"الگوها",web:"وب",
allLevels:"همه سطوح",beginner:"مبتدی",intermediate:"متوسط",advanced:"پیشرفته",
searchPh:"جستجوی مفاهیم...",random:"تصادفی",share:"اشتراک PNG",
play:"پخش",pause:"توقف",prev:"قبلی",next:"بعدی",step:"مرحله",code:"کد",progress:"پیشرفت",langToggle:"EN"
}
};
let lang=localStorage.getItem("cv_lang")||"en";
function t(k){return i18n[lang][k]||i18n.en[k]}
function applyLang(){
document.documentElement.lang=lang;
document.documentElement.dir=lang==="fa"?"rtl":"ltr";
document.getElementById("langBtn").textContent=t("langToggle");
document.getElementById("streak").textContent=getStreak()+" "+t("streak");
const cf=document.getElementById("categoryFilter");
cf.innerHTML=`<option value="all">${t("allCategories")}</option><option value="ds">${t("ds")}</option><option value="algo">${t("algo")}</option><option value="pattern">${t("pattern")}</option><option value="web">${t("web")}</option>`;
const lf=document.getElementById("levelFilter");
lf.innerHTML=`<option value="all">${t("allLevels")}</option><option value="beginner">${t("beginner")}</option><option value="intermediate">${t("intermediate")}</option><option value="advanced">${t("advanced")}</option>`;
document.getElementById("search").placeholder=t("searchPh");
document.getElementById("randomBtn").textContent=t("random");
document.getElementById("shareBtn").textContent=t("share");
document.getElementById("prevBtn").textContent=t("prev");
document.getElementById("playBtn").textContent=isPlaying?t("pause"):t("play");
document.getElementById("nextBtn").textContent=t("next");
document.getElementById("codeTitle").textContent=t("code");
document.getElementById("progressTitle").textContent=t("progress");
if(currentConcept)loadConcept(currentConcept);
}
document.getElementById("langBtn").onclick=()=>{lang=lang==="en"?"fa":"en";localStorage.setItem("cv_lang",lang);applyLang()};

let theme=localStorage.getItem("cv_theme")||"dark";
function applyTheme(){document.documentElement.setAttribute("data-theme",theme);document.getElementById("themeBtn").textContent=theme==="dark"?"Light":"Dark"}
document.getElementById("themeBtn").onclick=()=>{theme=theme==="dark"?"light":"dark";localStorage.setItem("cv_theme",theme);applyTheme()};
applyTheme();

const concepts=[
{id:"stack",title:{en:"Stack",fa:"پشته"},category:"ds",level:"beginner",
desc:{en:"A Last-In-First-Out (LIFO) data structure. Elements are pushed on top and popped from the top.",fa:"ساختمان داده آخر-ورودی-اول-خروجی. عناصر از بالا اضافه و از بالا حذف می‌شوند."},
code:"class Stack {\n  constructor() { this.items = []; }\n  push(item) { this.items.push(item); }\n  pop() { return this.items.pop(); }\n  peek() { return this.items[this.items.length-1]; }\n  isEmpty() { return this.items.length === 0; }\n}",
steps:[{type:"push",val:"A"},{type:"push",val:"B"},{type:"push",val:"C"},{type:"pop"},{type:"pop"}]},
{id:"queue",title:{en:"Queue",fa:"صف"},category:"ds",level:"beginner",
desc:{en:"A First-In-First-Out (FIFO) data structure. Elements are enqueued at the back and dequeued from the front.",fa:"ساختمان داده اول-ورودی-اول-خروجی. عناصر از انتها وارد و از ابتدا خارج می‌شوند."},
code:"class Queue {\n  constructor() { this.items = []; }\n  enqueue(item) { this.items.push(item); }\n  dequeue() { return this.items.shift(); }\n  front() { return this.items[0]; }\n  isEmpty() { return this.items.length === 0; }\n}",
steps:[{type:"enqueue",val:"A"},{type:"enqueue",val:"B"},{type:"enqueue",val:"C"},{type:"dequeue"},{type:"dequeue"}]},
{id:"linkedlist",title:{en:"Linked List",fa:"لیست پیوندی"},category:"ds",level:"intermediate",
desc:{en:"A linear data structure where each element points to the next node, allowing O(1) insertions.",fa:"ساختمان داده خطی که هر عنصر به گره بعدی اشاره می‌کند و درج O(1) را ممکن می‌سازد."},
code:"class Node {\n  constructor(val) {\n    this.val = val;\n    this.next = null;\n  }\n}\nclass LinkedList {\n  append(val) {\n    const node = new Node(val);\n    if (!this.head) { this.head = node; return; }\n    let curr = this.head;\n    while (curr.next) curr = curr.next;\n    curr.next = node;\n  }\n}",
steps:[{type:"add",val:"A"},{type:"add",val:"B"},{type:"add",val:"C"},{type:"traverse"},{type:"remove"}]},
{id:"binarysearch",title:{en:"Binary Search",fa:"جستجوی دودویی"},category:"algo",level:"beginner",
desc:{en:"An efficient search algorithm that divides the sorted array in half each step. O(log n) time complexity.",fa:"الگوریتم جستجوی کارآمد که آرایه مرتب را در هر مرحله نصف می‌کند. پیچیدگی زمانی O(log n)."},
code:"function binarySearch(arr, target) {\n  let low = 0, high = arr.length - 1;\n  while (low <= high) {\n    const mid = Math.floor((low + high) / 2);\n    if (arr[mid] === target) return mid;\n    if (arr[mid] < target) low = mid + 1;\n    else high = mid - 1;\n  }\n  return -1;\n}",
steps:[{type:"init",range:[0,15]},{type:"mid",val:7},{type:"narrow",dir:"right"},{type:"mid",val:11},{type:"found",val:11}]},
{id:"recursion",title:{en:"Recursion",fa:"بازگشت"},category:"pattern",level:"intermediate",
desc:{en:"A function that calls itself with a base case to terminate. Each call creates a new frame on the call stack.",fa:"تابعی که خودش را با یک حالت پایه فراخوانی می‌کند. هر فراخوانی فریم جدیدی روی پشته ایجاد می‌کند."},
code:"function factorial(n) {\n  if (n <= 1) return 1;\n  return n * factorial(n - 1);\n}\n\nfactorial(5);\n// 5 * 4 * 3 * 2 * 1 = 120",
steps:[{type:"call",val:5},{type:"call",val:4},{type:"call",val:3},{type:"base",val:1},{type:"return"}]},
{id:"bubbleSort",title:{en:"Bubble Sort",fa:"مرتب‌سازی حبابی"},category:"algo",level:"beginner",
desc:{en:"Repeatedly steps through the list, compares adjacent elements and swaps them if they are in the wrong order.",fa:"به طور مکرر لیست را پیمایش می‌کند، عناصر مجاور را مقایسه و در صورت نیاز جابجا می‌کند."},
code:"function bubbleSort(arr) {\n  for (let i = 0; i < arr.length; i++) {\n    for (let j = 0; j < arr.length - i - 1; j++) {\n      if (arr[j] > arr[j+1]) {\n        [arr[j], arr[j+1]] = [arr[j+1], arr[j]];\n      }\n    }\n  }\n  return arr;\n}",
steps:[{type:"compare",i:0,j:1},{type:"swap",i:0,j:1},{type:"compare",i:1,j:2},{type:"pass"},{type:"done"}]},
{id:"hashmap",title:{en:"Hash Map",fa:"جدول هش"},category:"ds",level:"intermediate",
desc:{en:"Stores key-value pairs using a hash function to compute an index into an array of buckets for O(1) average lookup.",fa:"جفت‌های کلید-مقدار را با استفاده از تابع هش برای محاسبه اندیس ذخیره می‌کند. جستجوی متوسط O(1)."},
code:"class HashMap {\n  constructor(size = 16) {\n    this.buckets = new Array(size).fill(null).map(() => []);\n    this.size = size;\n  }\n  hash(key) { return key.toString().length % this.size; }\n  set(key, val) { this.buckets[this.hash(key)].push([key, val]); }\n  get(key) {\n    return this.buckets[this.hash(key)].find(([k]) => k === key)?.[1];\n  }\n}",
steps:[{type:"insert",key:"name",val:"Ali"},{type:"hash",key:"name",bucket:4},{type:"insert",key:"age",val:25},{type:"hash",key:"age",bucket:3},{type:"lookup",key:"name"}]},
{id:"observer",title:{en:"Observer Pattern",fa:"الگوی ناظر"},category:"pattern",level:"advanced",
desc:{en:"A design pattern where an object (subject) maintains a list of observers and notifies them of state changes automatically.",fa:"الگوی طراحی که شیء (موضوع) لیستی از ناظران را نگه می‌دارد و تغییرات حالت را خودکار اطلاع می‌دهد."},
code:"class Subject {\n  constructor() { this.observers = []; }\n  subscribe(fn) { this.observers.push(fn); }\n  notify(data) { this.observers.forEach(fn => fn(data)); }\n}\nconst sub = new Subject();\nsub.subscribe(d => console.log('Got:', d));\nsub.notify('hello');",
steps:[{type:"subscribe",who:"A"},{type:"subscribe",who:"B"},{type:"event",val:"update"},{type:"notify",to:"A"},{type:"notify",to:"B"}]},
{id:"dom",title:{en:"DOM Tree",fa:"درخت DOM"},category:"web",level:"beginner",
desc:{en:"The Document Object Model represents HTML as a tree structure where each node is an object representing a part of the document.",fa:"مدل شیء سند، HTML را به صورت ساختار درختی نمایش می‌دهد که هر گره بخشی از سند است."},
code:"document.querySelector('#app')\n  .addEventListener('click', (e) => {\n    const el = document.createElement('div');\n    el.textContent = 'Clicked!';\n    e.target.appendChild(el);\n  });",
steps:[{type:"build",tag:"html"},{type:"build",tag:"body"},{type:"build",tag:"div"},{type:"event",val:"click"},{type:"mutate"}]},
{id:"closure",title:{en:"Closure",fa:"بسته (کلوژر)"},category:"pattern",level:"advanced",
desc:{en:"A closure is a function that retains access to its lexical scope even when executed outside that scope.",fa:"بسته تابعی است که حتی وقتی خارج از اسکوپ اصلی اجرا شود، به اسکوپ لغوی خود دسترسی دارد."},
code:"function counter() {\n  let count = 0;\n  return {\n    inc: () => ++count,\n    get: () => count\n  };\n}\nconst c = counter();\nc.inc(); c.inc(); c.get(); // 2",
steps:[{type:"create",scope:"outer"},{type:"capture",var:"count"},{type:"call",fn:"inc"},{type:"call",fn:"inc"},{type:"call",fn:"get"}]},
{id:"bintree",title:{en:"Binary Tree",fa:"درخت دودویی"},category:"ds",level:"intermediate",
desc:{en:"A tree data structure where each node has at most two children: left and right.",fa:"ساختمان داده درختی که هر گره حداکثر دو فرزند دارد: چپ و راست."},
code:"class TreeNode {\n  constructor(val) {\n    this.val = val;\n    this.left = null;\n    this.right = null;\n  }\n}\nconst root = new TreeNode(1);\nroot.left = new TreeNode(2);\nroot.right = new TreeNode(3);",
steps:[{type:"root",val:1},{type:"left",val:2},{type:"right",val:3},{type:"traverse"},{type:"done"}]},
{id:"bfs",title:{en:"Graph BFS",fa:"پیمایش سطحی گراف"},category:"algo",level:"intermediate",
desc:{en:"Breadth-First Search explores all neighbors at the current depth before moving deeper.",fa:"جستجوی سطحی تمام همسایه‌ها را در عمق فعلی قبل از رفتن به عمق بیشتر بررسی می‌کند."},
code:"function bfs(graph, start) {\n  const visited = new Set();\n  const queue = [start];\n  while (queue.length) {\n    const node = queue.shift();\n    if (!visited.has(node)) {\n      visited.add(node);\n      for (const n of graph[node]) queue.push(n);\n    }\n  }\n}",
steps:[{type:"visit",val:"A"},{type:"enqueue",val:"B,C"},{type:"visit",val:"B"},{type:"visit",val:"C"},{type:"done"}]},
{id:"dfs",title:{en:"Graph DFS",fa:"پیمایش عمقی گراف"},category:"algo",level:"intermediate",
desc:{en:"Depth-First Search goes as deep as possible along each branch before backtracking.",fa:"جستجوی عمقی تا حد ممکن در هر شاخه پیش می‌رود قبل از بازگشت."},
code:"function dfs(graph, node, visited = new Set()) {\n  if (visited.has(node)) return;\n  visited.add(node);\n  for (const n of graph[node]) dfs(graph, n, visited);\n}",
steps:[{type:"visit",val:"A"},{type:"go",val:"B"},{type:"go",val:"D"},{type:"backtrack"},{type:"go",val:"C"}]},
{id:"mergesort",title:{en:"Merge Sort",fa:"مرتب‌سازی ادغامی"},category:"algo",level:"intermediate",
desc:{en:"Divides the array in half, recursively sorts each half, then merges them back together.",fa:"آرایه را نصف می‌کند، هر نیمه را مرتب و سپس ادغام می‌کند."},
code:"function mergeSort(arr) {\n  if (arr.length <= 1) return arr;\n  const mid = Math.floor(arr.length / 2);\n  const left = mergeSort(arr.slice(0, mid));\n  const right = mergeSort(arr.slice(mid));\n  return merge(left, right);\n}",
steps:[{type:"split",val:"[5,3,8,1]"},{type:"split",val:"[5,3][8,1]"},{type:"sort",val:"[3,5][1,8]"},{type:"merge",val:"[1,3,5,8]"},{type:"done"}]},
{id:"quicksort",title:{en:"Quick Sort",fa:"مرتب‌سازی سریع"},category:"algo",level:"advanced",
desc:{en:"Selects a pivot element and partitions the array so elements less than pivot go left, greater go right.",fa:"یک محور انتخاب و آرایه را طوری تقسیم می‌کند که کوچکترها چپ و بزرگترها راست بروند."},
code:"function quickSort(arr) {\n  if (arr.length <= 1) return arr;\n  const pivot = arr[0];\n  const left = arr.slice(1).filter(x => x < pivot);\n  const right = arr.slice(1).filter(x => x >= pivot);\n  return [...quickSort(left), pivot, ...quickSort(right)];\n}",
steps:[{type:"pivot",val:5},{type:"partition"},{type:"left",val:"[3,1]"},{type:"right",val:"[8,7]"},{type:"done"}]},
{id:"singleton",title:{en:"Singleton Pattern",fa:"الگوی تک‌نمونه"},category:"pattern",level:"beginner",
desc:{en:"Ensures a class has only one instance and provides a global point of access to it.",fa:"تضمین می‌کند کلاس فقط یک نمونه داشته باشد و دسترسی سراسری به آن فراهم شود."},
code:"class Singleton {\n  static #instance = null;\n  static getInstance() {\n    if (!Singleton.#instance)\n      Singleton.#instance = new Singleton();\n    return Singleton.#instance;\n  }\n}",
steps:[{type:"call1"},{type:"create"},{type:"call2"},{type:"same"},{type:"done"}]},
{id:"factory",title:{en:"Factory Pattern",fa:"الگوی کارخانه"},category:"pattern",level:"intermediate",
desc:{en:"Provides an interface for creating objects without specifying their exact class.",fa:"رابطی برای ساخت اشیاء بدون مشخص کردن کلاس دقیق آن‌ها فراهم می‌کند."},
code:"function createAnimal(type) {\n  const animals = { dog: Dog, cat: Cat };\n  return new animals[type]();\n}\nconst a = createAnimal('dog');\na.speak();",
steps:[{type:"input",val:"dog"},{type:"lookup"},{type:"create"},{type:"return"},{type:"use"}]},
{id:"promise",title:{en:"Promise / Async",fa:"پرامیس / ناهمگام"},category:"web",level:"intermediate",
desc:{en:"A Promise represents a value that may be available now, later, or never. Used for async operations.",fa:"پرامیس مقداری را نشان می‌دهد که الان، بعداً یا هیچوقت موجود است. برای عملیات ناهمگام استفاده می‌شود."},
code:"fetch('/api/data')\n  .then(res => res.json())\n  .then(data => console.log(data))\n  .catch(err => console.error(err));",

function getStreak(){let s=0,d=new Date();while(true){const ds=d.toISOString().split("T")[0];if(doneDays.includes(ds)){s++;d.setDate(d.getDate()-1)}else break}return s}
function getBestStreak(){let b=0,c=0,sd=[...doneDays].sort();for(let i=0;i<sd.length;i++){if(i===0){c=1}else{const p=new Date(sd[i-1]),n2=new Date(sd[i]),d=(n2-p)/86400000;if(d===1)c++;else if(d>1)c=1}if(c>b)b=c}return b}function updateStats(){document.getElementById("streak").textContent=getStreak()+" "+t("streak");document.getElementById("statTotal").textContent=doneDays.length;document.getElementById("statBest").textContent=getBestStreak();const seen=new Set(doneDays.map((_,i)=>concepts[i%concepts.length]?.id));document.getElementById("statConcepts").textContent=Math.min(doneDays.length,concepts.length);document.getElementById("statTotalLbl").textContent=t("totalDays");document.getElementById("statBestLbl").textContent=t("bestStreak");document.getElementById("statConceptsLbl").textContent=t("conceptsSeen")}function updateStreak(){updateStats()}
function buildCalendar(){
const grid=document.getElementById("calGrid");grid.innerHTML="";
const start=new Date(calYear,calMonth,1);
const monthNames={en:["January","February","March","April","May","June","July","August","September","October","November","December"],fa:["ژانویه","فوریه","مارس","آوریل","مه","ژوئن","ژوئیه","اوت","سپتامبر","اکتبر","نوامبر","دسامبر"]};
document.getElementById("progressTitle").textContent=(t("progress")+" - "+(monthNames[lang]||monthNames.en)[calMonth]+" "+calYear);
for(let i=0;i<(start.getDay()+6)%7;i++){const d=document.createElement("div");d.className="cal-day";grid.appendChild(d)}
for(let i=1;i<=new Date(calYear,calMonth+1,0).getDate();i++){
const d=document.createElement("div"),ds=`${calYear}-${String(calMonth+1).padStart(2,"0")}-${String(i).padStart(2,"0")}`;
d.className="cal-day"+(doneDays.includes(ds)?" done":"")+(ds===today?" today":"");
d.textContent=i;grid.appendChild(d);
}}
document.getElementById("calPrev").onclick=()=>{calMonth--;if(calMonth<0){calMonth=11;calYear--}buildCalendar()};
document.getElementById("calNext").onclick=()=>{calMonth++;if(calMonth>11){calMonth=0;calYear++}buildCalendar()};
function markDone(){if(!doneDays.includes(today)){doneDays.push(today);localStorage.setItem("cv_done",JSON.stringify(doneDays))}localStorage.setItem("cv_lastConcept",currentConcept?currentConcept.id:"");updateStreak();buildCalendar()}

function loadConcept(c){
currentConcept=c;currentStep=0;isPlaying=false;clearInterval(playInterval);
document.getElementById("conceptTitle").textContent=c.title[lang]||c.title.en;
document.getElementById("conceptLevel").textContent=t(c.level);
document.getElementById("conceptDesc").textContent=c.desc[lang]||c.desc.en;
document.getElementById("codeBlock").innerHTML=c.code;
document.getElementById("playBtn").textContent=t("play");
currentStep=0;animProgress=0;drawStep();
}

function easeInOut(t){return t<0.5?t*t*(t*4-1):1-Math.pow(-t+2,3)/2}
function interp(a,b,p){return a+(b-a)*easeInOut(p)}

function syncCodeLine(){
if(!currentConcept)return;
const lines=c.currentConcept.code.split("\n");
const step=currentConcept.steps[currentStep];
if(!step||!lines)return;
let targetLine=0;
if(step.val)lines.forEach((l,i)=>{if(l.includes(step.val)||l.includes(String(step.val)))targetLine=i});
for(let i=0;i<lines.length;i++){
lines[i]=lines[i].replace(/^(?!.*<mark>).*(?!.*<\/mark>).*$/m,(m)=>i===targetLine?`<mark>${m}</mark>`:m);
}
document.getElementById("codeBlock").innerHTML=lines.join("\n");
}

function filterAndLoad(){
const cat=document.getElementById("categoryFilter").value,lvl=document.getElementById("levelFilter").value,q=document.getElementById("search").value.toLowerCase();
let filtered=concepts.filter(c=>(cat==="all"||c.category===cat)&&(lvl==="all"||c.level===lvl)&&(!q||(c.title.en+c.title.fa+c.desc.en+c.desc.fa).toLowerCase().includes(q)));
if(filtered.length)loadConcept(filtered[0]);
}

let animProgress=1,animRAF=null;
function easeOut(t){return 1-Math.pow(1-t,3)}
function animateTransition(){
if(animProgress>=1){cancelAnimationFrame(animRAF);return}
animProgress=Math.min(1,animProgress+0.04);
ctx.save();
ctx.globalAlpha=easeOut(animProgress);
drawStep();
ctx.restore();
animRAF=requestAnimationFrame(animateTransition);
}

function nextStep(){if(!currentConcept)return;currentStep=(currentStep+1)%currentConcept.steps.length;animProgress=0;cancelAnimationFrame(animRAF);animateTransition();markDone()}
function prevStep(){if(!currentConcept||currentStep===0)return;currentStep--;animProgress=0;cancelAnimationFrame(animRAF);animateTransition()}
function togglePlay(){if(isPlaying){clearInterval(playInterval);isPlaying=false;document.getElementById("playBtn").textContent=t("play")}else{isPlaying=true;document.getElementById("playBtn").textContent=t("pause");playInterval=setInterval(nextStep,1200)}}

document.getElementById("nextBtn").onclick=nextStep;
document.getElementById("prevBtn").onclick=prevStep;
document.getElementById("playBtn").onclick=togglePlay;
document.getElementById("randomBtn").onclick=()=>loadConcept(concepts[Math.floor(Math.random()*concepts.length)]);
document.getElementById("categoryFilter").onchange=filterAndLoad;

document.getElementById("search").oninput=filterAndLoad;`ndocument.addEventListener("keydown",e=>{if(e.target.tagName==="INPUT")return;if(e.key==="ArrowRight")nextStep();else if(e.key==="ArrowLeft")prevStep();else if(e.key===" "){e.preventDefault();togglePlay()}else if(e.key.toLowerCase()==="r")loadConcept(concepts[Math.floor(Math.random()*concepts.length)])});

document.getElementById("gifBtn").onclick=()=>{
