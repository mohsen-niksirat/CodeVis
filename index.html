<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#8b5cf6">
<title>CodeVis</title>
<!-- Phase 0: Add new concept renderer by adding entry to `concepts` array (line ~150) and creating an `else if(id==="newId"){...}` block in drawStep() -->
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--surface:#161b22;--border:#30363d;--text:#c9d1d9;--accent:#8b5cf6;--accent2:#a78bfa;--green:#3fb950;--red:#f85149}
[data-theme="light"]{--bg:#ffffff;--surface:#f6f8fa;--border:#d0d7de;--text:#1f2328;--accent:#7c3aed;--accent2:#6d28d9;--green:#1a7f37;--red:#cf222e}
[data-theme="light"] canvas{background:#f0f0f0}
[data-theme="light"] .code-block{background:#f0f0f0;color:#1f2328}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center}
[dir="rtl"] body{font-family:'Vazirmatn','Segoe UI',system-ui,sans-serif}
header{width:100%;max-width:900px;padding:24px 20px 0;display:flex;justify-content:space-between;align-items:center}
header h1{font-size:1.5rem;color:var(--accent2);letter-spacing:-0.5px}
.header-right{display:flex;gap:10px;align-items:center}
.streak{background:var(--surface);border:1px solid var(--border);padding:6px 14px;border-radius:20px;font-size:.85rem;color:var(--green)}
.lang-btn{background:var(--surface);border:1px solid var(--border);color:var(--accent2);padding:6px 14px;border-radius:20px;font-size:.85rem;cursor:pointer;font-weight:600;transition:opacity .2s}
.lang-btn:hover{opacity:.7}
.theme-btn{background:var(--surface);border:1px solid var(--border);color:var(--accent2);padding:6px 14px;border-radius:20px;font-size:.85rem;cursor:pointer;font-weight:600;transition:opacity .2s}
.theme-btn:hover{opacity:.7}
.controls{width:100%;max-width:900px;padding:16px 20px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.controls select,.controls input,.controls button{background:var(--surface);color:var(--text);border:1px solid var(--border);padding:8px 14px;border-radius:8px;font-size:.85rem;outline:none}
.controls button{cursor:pointer;background:var(--accent);color:#fff;border:none;font-weight:600;transition:opacity .2s}
.controls button:hover{opacity:.85}
.controls button.secondary{background:var(--surface);color:var(--text);border:1px solid var(--border)}
.main{width:100%;max-width:900px;padding:0 20px 40px;display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:700px){.main{grid-template-columns:1fr}header{flex-direction:column;gap:12px;align-items:flex-start}.controls{flex-direction:column}.controls select,.controls input,.controls button{width:100%}.stats{flex-direction:column}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;overflow:hidden}
.card h2{font-size:1.1rem;margin-bottom:6px;color:var(--accent2)}
.card .level{display:inline-block;font-size:.7rem;padding:2px 8px;border-radius:10px;background:var(--border);color:var(--text);margin-bottom:12px;text-transform:uppercase}
.card .desc{font-size:.9rem;line-height:1.6;margin-bottom:16px;color:#8b949e}
canvas{width:100%;height:auto;border-radius:8px;background:#0a0e14;display:block}
.code-block{background:#0a0e14;border-radius:8px;padding:14px;font-family:'Fira Code',monospace;font-size:.8rem;line-height:1.7;overflow-x:auto;white-space:pre;color:#e6edf3;max-height:300px;overflow-y:auto;direction:ltr;text-align:left}
.code-block mark{background:var(--accent);color:#fff;border-radius:3px;padding:0 2px}
.step-controls{display:flex;gap:8px;margin-top:14px;align-items:center}
.step-controls button{padding:6px 16px;font-size:.8rem}
.step-indicator{font-size:.8rem;color:#8b949e;margin-left:auto}
[dir="rtl"] .step-indicator{margin-left:0;margin-right:auto}
.controls input[type="range"]{flex:1;margin:0 8px}
.controls span{font-size:.8rem;color:var(--text)}
.calendar{width:100%;max-width:900px;padding:0 20px 40px}
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-header h3{font-size:1rem;color:var(--accent2);margin:0}
.cal-nav{background:var(--surface);border:1px solid var(--border);color:var(--text);padding:4px 12px;border-radius:6px;cursor:pointer;font-size:.85rem}
.cal-nav:hover{opacity:.7}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-day{aspect-ratio:1;border-radius:4px;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:.7rem;color:#484f58}
.cal-day.done{background:var(--accent);color:#fff;border-color:var(--accent)}
.cal-day.today{border-color:var(--green);color:var(--green)}
.stats{width:100%;max-width:900px;padding:0 20px 40px;display:flex;gap:12px;flex-wrap:wrap}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px 24px;flex:1;min-width:140px;text-align:center}
.stat-card .val{font-size:1.5rem;font-weight:700;color:var(--accent2)}
.stat-card .lbl{font-size:.8rem;color:#8b949e;margin-top:4px}
#shareCanvas{display:none}
#calendarCanvas{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px 24px}
body.fullscreen .card{display:inline-block;width:auto;max-width:100vw}
body.fullscreen .main{grid-template-columns:1fr}
body.fullscreen .code-block{max-height:400px}
input[type="range"]{background:var(--surface);color:var(--text)}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.sound-btn{background:var(--surface);border:1px solid var(--border);color:var(--accent2);padding:6px 14px;border-radius:20px;font-size:.85rem;cursor:pointer;font-weight:600;transition:opacity .2s}
.sound-btn:hover{opacity:.7}
.code-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.code-tabs{display:flex;gap:4px}
.code-tab{background:var(--surface);color:var(--text);border:1px solid var(--border);padding:4px 10px;border-radius:6px;font-size:.75rem;cursor:pointer;font-weight:600;transition:all .15s}
.code-tab:hover{border-color:var(--accent)}
.code-tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.playground-bar{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 12px;margin-bottom:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.playground-bar input{padding:4px 8px;border-radius:6px;background:var(--bg);border:1px solid var(--border);color:var(--text);font-size:.8rem;max-width:110px}
.playground-bar button{padding:4px 12px;font-size:.8rem;border-radius:6px;cursor:pointer}
.playground-title{font-size:.8rem;font-weight:600;color:var(--accent2)}
</style>
</head>
<body>
<header>
<h1>CodeVis</h1>
<div class="header-right">
<button class="sound-btn" id="soundBtn" aria-label="Toggle sound" title="Sound Effects">🔇</button>
<button class="theme-btn" id="themeBtn" aria-label="Toggle theme"></button>
<button class="lang-btn" id="langBtn" aria-label="Toggle language">فا</button>
<div class="streak" id="streak" aria-label="Current streak"></div>
</div>
</header>
<div class="controls">
<select id="categoryFilter" aria-label="Category filter"></select>
<select id="levelFilter" aria-label="Level filter"></select>
<input type="text" id="search" aria-label="Search concepts" autocomplete="off">
<button class="secondary" id="randomBtn" aria-label="Random concept"></button>
<button id="shareBtn" aria-label="Share as PNG"></button>
<button class="secondary" id="gifBtn" aria-label="Export as GIF">GIF</button>
<button class="secondary" id="videoBtn" aria-label="Export as WebM">WebM</button>
<input type="range" id="speedSlider" min="500" max="2000" value="1200" step="100" title="Step duration (ms)" aria-label="Step duration">
<span id="speedValue" aria-live="polite">1200ms</span>
<button class="secondary" id="fullscreenBtn" title="Fullscreen" aria-label="Toggle fullscreen">🌐</button>
<input type="range" id="timelineSlider" min="0" max="0" step="1" title="Step" aria-label="Timeline scrubber">
</div>
<div class="main">
<div class="card">
<h2 id="conceptTitle"></h2>
<span class="level" id="conceptLevel"></span>
<p class="desc" id="conceptDesc"></p>
<div id="playgroundBar" class="playground-bar" style="display:none"></div>
<canvas id="animCanvas" width="800" height="600" aria-label="Concept visualization canvas" role="img"></canvas>
<div class="step-controls">
<button class="secondary" id="prevBtn" aria-label="Previous step"></button>
<button id="playBtn" aria-label="Play animation"></button>
<button class="secondary" id="nextBtn" aria-label="Next step"></button>
<span class="step-indicator" id="stepInfo" aria-live="polite"></span>
</div>
</div>
<div class="card">
<div class="code-header">
<h2 id="codeTitle" style="margin:0"></h2>
<div class="code-tabs" id="codeLangTabs" role="tablist" aria-label="Code language">
<button class="code-tab active" data-lang="js" role="tab" aria-selected="true">JS</button>
<button class="code-tab" data-lang="py" role="tab" aria-selected="false">Python</button>
<button class="code-tab" data-lang="cpp" role="tab" aria-selected="false">C++</button>
</div>
</div>
<div class="code-block" id="codeBlock"></div>
</div>
</div>
<div class="calendar">
<div class="cal-header">
<button class="cal-nav" id="calPrev">&lt;</button>
<h3 id="progressTitle"></h3>
<button class="cal-nav" id="calNext">&gt;</button>
</div>
<div class="cal-grid" id="calGrid"></div>
</div>
  <div class="stats"><div class="stat-card"><div class="val" id="statTotal">0</div><div class="lbl" id="statTotalLbl"></div></div><div class="stat-card"><div class="val" id="statBest">0</div><div class="lbl" id="statBestLbl"></div></div><div class="stat-card"><div class="val" id="statConcepts">0</div><div class="lbl" id="statConceptsLbl"></div></div></div>
  <div class="card" id="studyListCard" style="width:100%;max-width:900px;margin:0 20px 40px;box-sizing:border-box">
    <h2 id="studyListTitle"></h2>
    <div id="studyList"><div class="desc" id="studyListEmpty"></div></div>
  </div><canvas id="shareCanvas" width="1200" height="675"></canvas>
<script src="https://cdn.jsdelivr.net/npm/gif.js@0.2.0/dist/gif.js"></script>
<script>
const i18n={
en:{
streak:"day streak",allCategories:"All Categories",ds:"Data Structures",algo:"Algorithms",pattern:"Patterns",web:"Web",
allLevels:"All Levels",beginner:"Beginner",intermediate:"Intermediate",advanced:"Advanced",
searchPh:"Search concepts...",random:"Random",share:"Share as PNG",
play:"Play",pause:"Pause",prev:"Prev",next:"Next",step:"Step",code:"Code",progress:"Progress",
totalDays:"Total Days",bestStreak:"Best Streak",conceptsSeen:"Concepts Seen",langToggle:"فا",
  studyList:"Your Learning Path",studyEmpty:"All concepts completed! Explore via search or random.",studyStart:"Start with these foundational concepts:",studyNext:"Next in path:",studyReview:"Review recently seen:",seen:"seen",sound:"Sound",playground:"Interactive Playground",shuffle:"Shuffle Array",searchTarget:"Search"
  },
  fa:{
streak:"روز متوالی",allCategories:"همه دسته‌ها",ds:"ساختمان داده",algo:"الگوریتم‌ها",pattern:"الگوها",web:"وب",
allLevels:"همه سطوح",beginner:"مبتدی",intermediate:"متوسط",advanced:"پیشرفته",
searchPh:"جستجوی مفاهیم...",random:"تصادفی",share:"اشتراک PNG",
play:"پخش",pause:"توقف",prev:"قبلی",next:"بعدی",step:"مرحله",code:"کد",progress:"پیشرفت",
totalDays:"کل روزها",bestStreak:"بهترین استریک",conceptsSeen:"مفاهیم دیده‌شده",langToggle:"EN",
  studyList:"مسیر یادگیری‌تان",studyEmpty:"همه مفاهیم تکمیل شدند! از طریق جستجو یا تصادفی بررسی کنید.",studyStart:"ابتدا با مفاهیم پایه شروع کنید:",studyNext:"بعدی در مسیر:",studyReview:"مرور مفاهیم اخیر:",seen:"دیده‌شده",sound:"صدا",playground:"آزمایشگاه تعاملی",shuffle:"تصادفی",searchTarget:"جستجو"
  }
};
let lang=localStorage.getItem("cv_lang")||"en";
function t(k){return i18n[lang][k]||i18n.en[k]}
function applyLang(){
document.documentElement.lang=lang;
document.documentElement.dir=lang==="fa"?"rtl":"ltr";
document.getElementById("langBtn").textContent=t("langToggle");
document.getElementById("streak").textContent=getStreak()+" "+t("streak");
const cf=document.getElementById("categoryFilter");
cf.innerHTML=`<option value="all">${t("allCategories")}</option><option value="ds">${t("ds")}</option><option value="algo">${t("algo")}</option><option value="pattern">${t("pattern")}</option><option value="web">${t("web")}</option>`;
const lf=document.getElementById("levelFilter");
lf.innerHTML=`<option value="all">${t("allLevels")}</option><option value="beginner">${t("beginner")}</option><option value="intermediate">${t("intermediate")}</option><option value="advanced">${t("advanced")}</option>`;
document.getElementById("search").placeholder=t("searchPh");
document.getElementById("randomBtn").textContent=t("random");
document.getElementById("shareBtn").textContent=t("share");
document.getElementById("prevBtn").textContent=t("prev");
document.getElementById("playBtn").textContent=isPlaying?t("pause"):t("play");
document.getElementById("nextBtn").textContent=t("next");
document.getElementById("codeTitle").textContent=t("code");
document.getElementById("progressTitle").textContent=t("progress");
if(currentConcept)loadConcept(currentConcept);
updateStats();
buildCalendar();
buildLearningPaths();
}
document.getElementById("langBtn").onclick=()=>{lang=lang==="en"?"fa":"en";localStorage.setItem("cv_lang",lang);applyLang()};

let theme=localStorage.getItem("cv_theme")||"dark";
function applyTheme(){document.documentElement.setAttribute("data-theme",theme);document.getElementById("themeBtn").textContent=theme==="dark"?"Light":"Dark"}
document.getElementById("themeBtn").onclick=()=>{theme=theme==="dark"?"light":"dark";localStorage.setItem("cv_theme",theme);applyTheme()};
applyTheme();

const concepts=[
{id:"stack",title:{en:"Stack",fa:"پشته"},category:"ds",level:"beginner",
desc:{en:"A Last-In-First-Out (LIFO) data structure. Elements are pushed on top and popped from the top.",fa:"ساختمان داده آخر-ورودی-اول-خروجی. عناصر از بالا اضافه و از بالا حذف می‌شوند."},
code:"class Stack {\n  constructor() { this.items = []; }\n  push(item) { this.items.push(item); }\n  pop() { return this.items.pop(); }\n  peek() { return this.items[this.items.length-1]; }\n  isEmpty() { return this.items.length === 0; }\n}",
steps:[{type:"push",val:"A"},{type:"push",val:"B"},{type:"push",val:"C"},{type:"pop"},{type:"pop"}]},
{id:"queue",title:{en:"Queue",fa:"صف"},category:"ds",level:"beginner",
desc:{en:"A First-In-First-Out (FIFO) data structure. Elements are enqueued at the back and dequeued from the front.",fa:"ساختمان داده اول-ورودی-اول-خروجی. عناصر از انتها وارد و از ابتدا خارج می‌شوند."},
code:"class Queue {\n  constructor() { this.items = []; }\n  enqueue(item) { this.items.push(item); }\n  dequeue() { return this.items.shift(); }\n  front() { return this.items[0]; }\n  isEmpty() { return this.items.length === 0; }\n}",
steps:[{type:"enqueue",val:"A"},{type:"enqueue",val:"B"},{type:"enqueue",val:"C"},{type:"dequeue"},{type:"dequeue"}]},
{id:"linkedlist",title:{en:"Linked List",fa:"لیست پیوندی"},category:"ds",level:"intermediate",
desc:{en:"A linear data structure where each element points to the next node, allowing O(1) insertions.",fa:"ساختمان داده خطی که هر عنصر به گره بعدی اشاره می‌کند و درج O(1) را ممکن می‌سازد."},
code:"class Node {\n  constructor(val) {\n    this.val = val;\n    this.next = null;\n  }\n}\nclass LinkedList {\n  append(val) {\n    const node = new Node(val);\n    if (!this.head) { this.head = node; return; }\n    let curr = this.head;\n    while (curr.next) curr = curr.next;\n    curr.next = node;\n  }\n}",
steps:[{type:"add",val:"A"},{type:"add",val:"B"},{type:"add",val:"C"},{type:"traverse"},{type:"remove"}]},
{id:"binarysearch",title:{en:"Binary Search",fa:"جستجوی دودویی"},category:"algo",level:"beginner",
desc:{en:"An efficient search algorithm that divides the sorted array in half each step. O(log n) time complexity.",fa:"الگوریتم جستجوی کارآمد که آرایه مرتب را در هر مرحله نصف می‌کند. پیچیدگی زمانی O(log n)."},
code:"function binarySearch(arr, target) {\n  let low = 0, high = arr.length - 1;\n  while (low <= high) {\n    const mid = Math.floor((low + high) / 2);\n    if (arr[mid] === target) return mid;\n    if (arr[mid] < target) low = mid + 1;\n    else high = mid - 1;\n  }\n  return -1;\n}",
steps:[{type:"init",range:[0,15]},{type:"mid",val:7},{type:"narrow",dir:"right"},{type:"mid",val:11},{type:"found",val:11}]},
{id:"recursion",title:{en:"Recursion",fa:"بازگشت"},category:"pattern",level:"intermediate",
desc:{en:"A function that calls itself with a base case to terminate. Each call creates a new frame on the call stack.",fa:"تابعی که خودش را با یک حالت پایه فراخوانی می‌کند. هر فراخوانی فریم جدیدی روی پشته ایجاد می‌کند."},
code:"function factorial(n) {\n  if (n <= 1) return 1;\n  return n * factorial(n - 1);\n}\n\nfactorial(5);\n// 5 * 4 * 3 * 2 * 1 = 120",
steps:[{type:"call",val:5},{type:"call",val:4},{type:"call",val:3},{type:"base",val:1},{type:"return"}]},
{id:"bubbleSort",title:{en:"Bubble Sort",fa:"مرتب‌سازی حبابی"},category:"algo",level:"beginner",
desc:{en:"Repeatedly steps through the list, compares adjacent elements and swaps them if they are in the wrong order.",fa:"به طور مکرر لیست را پیمایش می‌کند، عناصر مجاور را مقایسه و در صورت نیاز جابجا می‌کند."},
code:"function bubbleSort(arr) {\n  for (let i = 0; i < arr.length; i++) {\n    for (let j = 0; j < arr.length - i - 1; j++) {\n      if (arr[j] > arr[j+1]) {\n        [arr[j], arr[j+1]] = [arr[j+1], arr[j]];\n      }\n    }\n  }\n  return arr;\n}",
steps:[{type:"compare",i:0,j:1},{type:"swap",i:0,j:1},{type:"compare",i:1,j:2},{type:"pass"},{type:"done"}]},
{id:"hashmap",title:{en:"Hash Map",fa:"جدول هش"},category:"ds",level:"intermediate",
desc:{en:"Stores key-value pairs using a hash function to compute an index into an array of buckets for O(1) average lookup.",fa:"جفت‌های کلید-مقدار را با استفاده از تابع هش برای محاسبه اندیس ذخیره می‌کند. جستجوی متوسط O(1)."},
code:"class HashMap {\n  constructor(size = 16) {\n    this.buckets = new Array(size).fill(null).map(() => []);\n    this.size = size;\n  }\n  hash(key) { return key.toString().length % this.size; }\n  set(key, val) { this.buckets[this.hash(key)].push([key, val]); }\n  get(key) {\n    return this.buckets[this.hash(key)].find(([k]) => k === key)?.[1];\n  }\n}",
steps:[{type:"insert",key:"name",val:"Ali"},{type:"hash",key:"name",bucket:4},{type:"insert",key:"age",val:25},{type:"hash",key:"age",bucket:3},{type:"lookup",key:"name"}]},
{id:"observer",title:{en:"Observer Pattern",fa:"الگوی ناظر"},category:"pattern",level:"advanced",
desc:{en:"A design pattern where an object (subject) maintains a list of observers and notifies them of state changes automatically.",fa:"الگوی طراحی که شیء (موضوع) لیستی از ناظران را نگه می‌دارد و تغییرات حالت را خودکار اطلاع می‌دهد."},
code:"class Subject {\n  constructor() { this.observers = []; }\n  subscribe(fn) { this.observers.push(fn); }\n  notify(data) { this.observers.forEach(fn => fn(data)); }\n}\nconst sub = new Subject();\nsub.subscribe(d => console.log('Got:', d));\nsub.notify('hello');",
steps:[{type:"subscribe",who:"A"},{type:"subscribe",who:"B"},{type:"event",val:"update"},{type:"notify",to:"A"},{type:"notify",to:"B"}]},
{id:"dom",title:{en:"DOM Tree",fa:"درخت DOM"},category:"web",level:"beginner",
desc:{en:"The Document Object Model represents HTML as a tree structure where each node is an object representing a part of the document.",fa:"مدل شیء سند، HTML را به صورت ساختار درختی نمایش می‌دهد که هر گره بخشی از سند است."},
code:"document.querySelector('#app')\n  .addEventListener('click', (e) => {\n    const el = document.createElement('div');\n    el.textContent = 'Clicked!';\n    e.target.appendChild(el);\n  });",
steps:[{type:"build",tag:"html"},{type:"build",tag:"body"},{type:"build",tag:"div"},{type:"event",val:"click"},{type:"mutate"}]},
{id:"closure",title:{en:"Closure",fa:"بسته (کلوژر)"},category:"pattern",level:"advanced",
desc:{en:"A closure is a function that retains access to its lexical scope even when executed outside that scope.",fa:"بسته تابعی است که حتی وقتی خارج از اسکوپ اصلی اجرا شود، به اسکوپ لغوی خود دسترسی دارد."},
code:"function counter() {\n  let count = 0;\n  return {\n    inc: () => ++count,\n    get: () => count\n  };\n}\nconst c = counter();\nc.inc(); c.inc(); c.get(); // 2",
steps:[{type:"create",scope:"outer"},{type:"capture",var:"count"},{type:"call",fn:"inc"},{type:"call",fn:"inc"},{type:"call",fn:"get"}]},
{id:"bintree",title:{en:"Binary Tree",fa:"درخت دودویی"},category:"ds",level:"intermediate",
desc:{en:"A tree data structure where each node has at most two children: left and right.",fa:"ساختمان داده درختی که هر گره حداکثر دو فرزند دارد: چپ و راست."},

{id:"dijkstra",title:{en:"Dijkstra",fa:"دیکسترا"},category:"algo",level:"advanced",desc:{en:"Shortest path in weighted graph with non-negative edges.",fa:"کوتاه‌ترین مسیر در گراف وزن‌دار با یک‌جهت‌گیری مثبت."},code:"function dijkstra(graph,s){const d={},pq=new PriorityQueue();for(const n in graph)d[n]=Infinity;d[s]=0;pq.enqueue([s,0]);while(!pq.isEmpty()){const[u,w]=pq.dequeue();if(w>d[u])continue;for(const[v,c]of graph[u]){if(d[u]+c<d[v]){d[v]=d[u]+c;pq.enqueue([v,d[v]])}}}return d}",steps:[{type:"init"},{"type":"visit"},{"type":"relax"},{"type":"update"},{"type":"done"}]},

{id:"jwt",title:{en:"JWT Lifecycle",fa:"چرخه عمر JWT"},category:"web",level:"intermediate",desc:{en:"Header, payload, signature - base64url encoded for client-side storage and server verification.",fa:"سربرگ، بار محتوا، امضا - به صورت base64url برای ذخیره‌سازی سمت کلاینت و اعتبارسنجی سرور."},code:"// Header: {\"alg\":\"HS256\",\"typ\":\"JWT\"}\n// Payload: {\"sub\":123,\"exp\":1234567890}\n// Signature: HMAC(base64(header)+\".\"+base64(payload), secret)\n// Output: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOjEyM30...",steps:[{type:"header"},{"type":"payload"},{type:"sign"},{type:"token"},{type:"verify"}]},

{id:"gc",title:{en:"Garbage Collection",fa:"جمع‌آوری زباله"},category:"ds",level:"advanced",desc:{en:"Mark-and-sweep: identify reachable objects, mark, then sweep unreachable memory.",fa:"علامت و پاک‌سازی: شناسایی اشیاء قابل‌دسترس، علامت‌گذاری، سپس پاک‌سازی حافظه غیرمرجع."},code:"// Phase 1: Mark all roots and reachable objects\n// Phase 2: Sweep all unmarked memory regions as garbage\n// Phase 3: Compact heap if fragmentation > threshold\nfunction isGarbage(obj){return !obj.reachableFromGC}",steps:[{type:"roots"},{"type":"mark"},{"type":"sweep"},{type:"free"},{"type":"compact"}]},
{id:"bloom",title:{en:"Bloom Filter",fa:"فیلتر بلوم"},category:"ds",level:"advanced",desc:{en:"Space-efficient probabilistic set membership test with false positive rate.",fa:"تست عضویت احتمالی فضای صرفه‌جویی‌شده با نرخ خطای مثبت."},code:"class BloomFilter{\n  constructor(size,hashCount){this.bits=new Uint8Array(size);this.k=hashCount}\n  add(item){for(const h of this.hash(item))this.bits[h%this.bits.length]=1}\n  mightContain(item){return this.hash(item).every(h=>this.bits[h%this.bits.length]===1)}\n}",steps:[{type:"init"},{"type":"hash"},{type:"set"},{type:"query"},{type:"result"}]},
{id:"lru",title:{en:"LRU Cache",fa:"کش LRU"},category:"ds",level:"intermediate",desc:{en:"Evict least recently used item when cache is full. Doubly-linked list + hash map for O(1) operations.",fa:"حذف کمترین دسترسی اخیر وقت کش پر است. لیست دوطرفه + جدotle هش برای عملیات O(1)."},code:"class LRUCache{constructor(k){this.c=k;this.map=new Map()}\nget(k){if(!this.map.has(k))return-1;const v=this.map.get(k);this.map.delete(k);this.map.set(k,v);return v}\nput(k,v){if(this.map.has(k))this.map.delete(k);else if(this.map.size===this.c){const f=this.map.keys().next().value;this.map.delete(f);this.map.set(k,v)}}",steps:[{type:"get"},{type:"hit"},{type:"reorder"},{type:"miss"},{type:"evict"}]},

  let html="";

    review.forEach(id=>{const c=concepts.find(x=>x.id===id);if(c)html+=`<button class="secondary" style="width:100%;justify-content:flex-start" onclick="loadConcept('${c.id}')" aria-label="${t('seen')}: ${c.title[lang]||c.title.en}">${c.title[lang]||c.title.en} <span style="color:#8b5cf6;margin-left:auto;font-size:.7rem">${t('seen')}</span></button>`});

    if(starter.length){
      html+='<div class="step-controls" style="flex-direction:column;gap:4px;margin-bottom:8px"><span class="step-indicator" style="font-size:.75rem;color:#8b949e">'+t("studyStart")+'</span>';
       starter.forEach(c=>html+=`<button class="secondary" style="width:100%;justify-content:flex-start" onclick="loadConcept('${c.id}')" aria-label="Learn ${c.title[lang]||c.title.en}">${c.title[lang]||c.title.en} <span style="color:#3fb950;margin-left:auto;font-size:.7rem">${c.level}</span></button>`);

       html+='<div class="step-controls" style="flex-direction:column;gap:4px"><span class="step-indicator" style="font-size:.75rem;color:#8b949e">'+t("studyNext")+'</span>';

let soundEnabled = localStorage.getItem("cv_sound") === "true";
let audioCtx = null;
function updateSoundBtn() {
  const btn = document.getElementById("soundBtn");
  if (btn) btn.textContent = soundEnabled ? "🔊" : "🔇";
}
function playTone(freq = 440, duration = 0.08, type = "sine") {
  if (!soundEnabled) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  } catch(e) {}
}
const sBtn = document.getElementById("soundBtn");
if (sBtn) {
  sBtn.onclick = () => {
    soundEnabled = !soundEnabled;
    localStorage.setItem("cv_sound", soundEnabled ? "true" : "false");
    updateSoundBtn();
    if (soundEnabled) playTone(587.33, 0.1);
  };
  updateSoundBtn();
}

function getCodeForLang(concept, langCode) {
  if (!concept) return "";
  if (langCode === "js") return concept.code;
  if (extraCode[concept.id] && extraCode[concept.id][langCode]) {
    return extraCode[concept.id][langCode];
  }
  if (langCode === "py") {
    return "# Python equivalent for " + (concept.title.en || "") + "\n" + concept.code.replace(/const |let |var /g, "").replace(/;/g, "");
  }
  if (langCode === "cpp") {
    return "// C++ equivalent for " + (concept.title.en || "") + "\n" + concept.code;
  }
  return concept.code;
}

let customState = null;
function updatePlayground() {
  const bar = document.getElementById("playgroundBar");
  if (!bar || !currentConcept) return;
  const id = currentConcept.id;
  
  if (id === "stack") {
    bar.style.display = "flex";
    bar.innerHTML = `<span class="playground-title">🎮 ${t("playground")}:</span>
      <input type="text" id="pgStackVal" value="D" maxlength="5" style="width:60px" aria-label="Item value">

      <button class="secondary" id="pgStackReset">Reset</button>
      <span class="playground-badge" id="pgStackCount">Items: 3</span>`;
    const getItems = () => (customState && customState.stack) ? customState.stack : ["A", "B", "C"];
    const updateCount = () => {
      const el = document.getElementById("pgStackCount");
      if (el) el.textContent = "Items: " + getItems().length;
    };
    document.getElementById("pgStackPush").onclick = () => {
      const inp = document.getElementById("pgStackVal");
      const val = inp.value.trim() || "X";
      if (!customState || !customState.stack) customState = { stack: ["A", "B", "C"] };

        playTone(350 + customState.stack.length * 70, 0.08);

        updateCount();
      }
    };
    document.getElementById("pgStackPop").onclick = () => {
      if (!customState || !customState.stack) customState = { stack: ["A", "B", "C"] };

        playTone(280, 0.08);

    const updateCount = () => {
      const el = document.getElementById("pgQueueCount");
      if (el) el.textContent = "Items: " + getItems().length;
    };
    document.getElementById("pgQueueEnq").onclick = () => {
      const inp = document.getElementById("pgQueueVal");
      const val = inp.value.trim() || "X";
      if (!customState || !customState.queue) customState = { queue: ["A", "B", "C"] };
      if (customState.queue.length < 6) {
        customState.queue.push(val);
        playTone(350 + customState.queue.length * 70, 0.08);
        drawStep();
        updateCount();
      }
    };
    document.getElementById("pgQueueDeq").onclick = () => {
      if (!customState || !customState.queue) customState = { queue: ["A", "B", "C"] };
      if (customState.queue.length > 0) {
        customState.queue.shift();
        playTone(280, 0.08);
        drawStep();
        updateCount();
      }
    };
    document.getElementById("pgQueueReset").onclick = () => {
      customState = null;
      drawStep();
      updateCount();
    };
    updateCount();
  } else if (["bubbleSort", "insertionsort", "selectionsort", "mergesort", "quicksort", "heapSort"].includes(id)) {
    bar.style.display = "flex";
    bar.innerHTML = `<span class="playground-title">🎮 Array:</span>

      <span class="playground-badge" id="pgSortStatus">Interactive</span>`;

      setTimeout(() => playTone(660, 0.08), 80);
      drawStep();
    };
  } else {
    bar.style.display = "none";
  }

function easeInOut(t){return t<0.5?t*t*(t*4-1):1-Math.pow(-t+2,3)/2}
function interp(a,b,p){return a+(b-a)*easeInOut(p)}

function syncCodeLine(){
if(!currentConcept)return;
const codeText=getCodeForLang(currentConcept, codeLang);
const lines=codeText.split("\n").map(esc);
const step=currentConcept.steps[currentStep];
if(!step)return;
let targetLine=0;
if(step.val!=null){const sv=String(step.val);lines.forEach((l,i)=>{if(l.includes(sv))targetLine=i})}
document.getElementById("codeBlock").innerHTML=lines.map((l,i)=>i===targetLine?`<mark>${l}</mark>`:l).join("\n");
}

function filterAndLoad(){
const cat=document.getElementById("categoryFilter").value,lvl=document.getElementById("levelFilter").value,q=document.getElementById("search").value.toLowerCase();
let filtered=concepts.filter(c=>(cat==="all"||c.category===cat)&&(lvl==="all"||c.level===lvl)&&(!q||(c.title.en+c.title.fa+c.desc.en+c.desc.fa).toLowerCase().includes(q)));
if(filtered.length)loadConcept(filtered[0]);
}

let animRAF=null;
function easeOut(t){return 1-Math.pow(1-t,3)}
function animateTransition(){
if(animProgress>=1){cancelAnimationFrame(animRAF);return}
animProgress=Math.min(1,animProgress+0.04);
ctx.save();
ctx.globalAlpha=easeOut(animProgress);
drawStep();
ctx.restore();
animRAF=requestAnimationFrame(animateTransition);
}

function nextStep(){if(!currentConcept)return;currentStep=(currentStep+1)%currentConcept.steps.length;animProgress=0;cancelAnimationFrame(animRAF);playTone(320+(currentStep+1)*80,0.06);animateTransition();syncCodeLine();updateTimelineSlider();if(currentStep===currentConcept.steps.length-1)markDone()}
function prevStep(){if(!currentConcept||currentStep===0)return;currentStep--;animProgress=0;cancelAnimationFrame(animRAF);playTone(300+currentStep*70,0.06);animateTransition();syncCodeLine();updateTimelineSlider()}
function togglePlay(){if(isPlaying){clearInterval(playInterval);isPlaying=false;document.getElementById("playBtn").textContent=t("play")}else{isPlaying=true;document.getElementById("playBtn").textContent=t("pause");playInterval=setInterval(nextStep,stepDuration)}}

document.getElementById("nextBtn").onclick=nextStep;
document.getElementById("prevBtn").onclick=prevStep;

document.getElementById("randomBtn").onclick=()=>loadConcept(concepts[Math.floor(Math.random()*concepts.length)]);

document.getElementById("videoBtn").onclick=()=>{
if(!currentConcept)return;
const stream=canvas.captureStream(30);
let recorder;
try{recorder=new MediaRecorder(stream,{mimeType:'video/webm'})}
catch(e){recorder=new MediaRecorder(stream)}
const chunks=[];
recorder.ondataavailable=e=>{if(e.data&&e.data.size>0)chunks.push(e.data)};
recorder.onstop=()=>{
  const blob=new Blob(chunks,{type:'video/webm'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='codevis-'+currentConcept.id+'.webm';
  a.click();
};
recorder.start();
const savedStep=currentStep;
let stepIdx=0;
currentStep=0;
drawStep();
syncCodeLine();
updateTimelineSlider();
const recInt=setInterval(()=>{
  stepIdx++;
  if(stepIdx<currentConcept.steps.length){
    currentStep=stepIdx;
    drawStep();
    syncCodeLine();
    updateTimelineSlider();
  }else{
    clearInterval(recInt);
    setTimeout(()=>{
      try{recorder.stop()}catch(e){}
      currentStep=savedStep;
      drawStep();
      syncCodeLine();
      updateTimelineSlider();
    },Math.max(500,stepDuration/2));
  }
},stepDuration);
};
